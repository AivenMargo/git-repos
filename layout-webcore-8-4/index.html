<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>

        <div class="swiper-slide">
          <img class="brand-logo" src="./assets/img/lenovo.svg" alt="Lenovo" />
          <button class="brand-button" type="button">
            <img src="./assets/img/go-icon.svg" alt="Go" />
          </button>
        </div>
        <div class="swiper-slide">
          <img class="brand-logo" src="./assets/img/samsung.svg" alt="Lenovo" />

            <img src="./assets/img/go-icon.svg" alt="Go" />
          </button>
        </div>
        <div class="swiper-slide">
          <img class="brand-logo" src="./assets/img/apple.svg" alt="Lenovo" />

            <img src="./assets/img/go-icon.svg" alt="Go" />
          </button>
        </div>
        <div class="swiper-slide">
          <img class="brand-logo" src="./assets/img/viewsonic.svg" alt="Lenovo" />

            <img src="./assets/img/go-icon.svg" alt="Go" />

        </div>
        <div class="swiper-slide">
          <img class="brand-logo" src="./assets/img/bosch.svg" alt="Lenovo" />

            <img src="./assets/img/go-icon.svg" alt="Go" />
          </button>
        </div>
        <div class="swiper-slide">
          <img class="brand-logo" src="./assets/img/hp.svg" alt="Lenovo" />

            <img src="./assets/img/go-icon.svg" alt="Go" />
          </button>
        </div>
        <div class="swiper-slide">
          <img class="brand-logo" src="./assets/img/acer.svg" alt="Lenovo" />
          <button class="brand-button" type="button">
            <img src="./assets/img/go-icon.svg" alt="Go" />
          </button>
        </div>
        <div class="swiper-slide">
          <img class="brand-logo" src="./assets/img/sony.svg" alt="Lenovo" />
          <button class="brand-button" type="button">
            <img src="./assets/img/go-icon.svg" alt="Go" />
          </button>
        </div>
        <div class="swiper-slide">
          <img class="brand-logo" src="./assets/img/lenovo.svg" alt="Lenovo" />

            <img src="./assets/img/go-icon.svg" alt="Go" />
          </button>
        </div>
        <div class="swiper-slide">
          <img class="brand-logo" src="./assets/img/samsung.svg" alt="Lenovo" />
          <button class="brand-button" type="button">
            <img src="./assets/img/go-icon.svg" alt="Go" />
          </button>
        </div>
        <div class="swiper-slide">
          <img class="brand-logo" src="./assets/img/apple.svg" alt="Lenovo" />
          <button class="brand-button" type="button">
            <img src="./assets/img/go-icon.svg" alt="Go" />
          </button>
        </div>
      </div>
      <!-- If we need pagination -->
      <div class="swiper-pagination"></div>
    </div>
    <button class="services-toggle" type="button"> 
      <div class="service-toggle__icon"><img src="./assets/img/read-more-icon.svg" alt="more icon"></div>
      <div class="service-toggle__text">Показать все</div>
    </button>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <script src="script.js"></script>
