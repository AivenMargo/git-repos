<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Slide Menu</title>
</head>
<body>
    <div class="mobile-menu">
    <header class="menu-header">
        <div class="menu-header__left-group">
            <button class="menu-header__button"><img src="./assets/img/burger.svg" alt="burger img"></button>
        <div class="menu-header__logo"><img src="./assets/img/company-logo.svg" alt="company logo"></div>
        </div>
        <div class="menu-header__right-group">
            <button class="menu-header__button"><img src="./assets/img/search.svg" alt="search img"></button>
        </div>  
    </header>
    <main class="mobile-menu__main-content">
        <ul class="service-list">
            <li class="service-list__element service-list__element--active"><a href="#">Ремонт техники </a></li>
            <li class="service-list__element "><a href="#">Услуги и сервисы </a></li>
            <li class="service-list__element "><a href="#">Корпоративным клиентам</a></li>
            <li class="service-list__element "><a href="#">Продавцам техники </a></li>
            <li class="service-list__element "><a href="#">Партнерам</a></li>
            <li class="service-list__element "><a href="#">Производителям</a></li>
            <li class="service-list__element "><a href="#">Наши сервисные центры</a></li>
            <li class="service-list__element "><a href="#">Контакты</a></li>
        </ul>
    </main>
    <footer class="mobile-menu__contact-info">
        <div class="button-group">
            <button class="button-group__element"><img src="./assets/img/call.svg" alt="call img"></button>
            <button class="button-group__element"><img src="./assets/img/chat.svg" alt="chat img"></button>
            <button class="button-group__element"><img src="./assets/img/profile.svg" alt="profile img"></button>
        </div>
        <div class="mobile-menu__mail">mail@cps.com</div>
        <div class="mobile-menu__phone">8 800 890 8900</div>
        <div class="language-group">
            <div class="language-group__element language-group__element--active">RU</div>
            <div class="language-group__element">EN</div>
            <div class="language-group__element">CH</div>
        </div>
    </footer>
    </div>
</body>
</html>
